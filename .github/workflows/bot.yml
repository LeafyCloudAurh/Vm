name: Deobf Bot

# O zip do bot NÃO fica no repositório: ele é baixado da sua API (protegida por chave)
# só durante a execução. Secrets necessários:
#   DOWNLOAD_API_KEY  -> a chave da API de download
#   DISCORD_TOKEN     -> token do bot
#   PASTEFY_TOKEN     -> (opcional)
#   GROQ_API_KEY      -> (opcional) chave do console.groq.com para o comando .ia
#   MONGO_URI         -> (opcional) string de conexão do MongoDB, para o /resync
on:
  workflow_dispatch:
  push:
    branches: [main]
  schedule:
    - cron: "0 */5 * * *"   # religa a cada 5h (limite de um job é 6h)

concurrency:
  group: deobf-bot
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 345
    env:
      LUAU_TAG: "0.739"
      # (opcional) crie a variável DOWNLOAD_URL em Settings > Secrets and variables > Actions > Variables
      DOWNLOAD_URL: ${{ vars.DOWNLOAD_URL || 'https://jsjsjwisjsjwjsjwjwhuwuhdhd.vercel.app/download' }}

    steps:
      - name: Conferir configuração
        env:
          KEY: ${{ secrets.DOWNLOAD_API_KEY }}
          DISCORD: ${{ secrets.DISCORD_TOKEN }}
        run: |
          [ -n "$KEY" ]     || { echo "::error::Crie o secret DOWNLOAD_API_KEY (a chave da API de download)"; exit 1; }
          [ -n "$DISCORD" ] || { echo "::error::Crie o secret DISCORD_TOKEN"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # A chave vai no header (não na URL), então não aparece em logs de acesso
      - name: Baixar o bot da API
        env:
          KEY: ${{ secrets.DOWNLOAD_API_KEY }}
        run: |
          set -euo pipefail
          CODE=$(curl -sS -L --retry 4 --retry-delay 5 --retry-all-errors --max-time 600 \
            -H "x-api-key: $KEY" -o bot.zip -w '%{http_code}' "$DOWNLOAD_URL" || true)
          if [ "$CODE" != "200" ]; then
            case "$CODE" in
              401) echo "::error::API recusou a chave (401). Confira o secret DOWNLOAD_API_KEY." ;;
              404) echo "::error::Arquivo não encontrado na API (404)." ;;
              *)   echo "::error::Falha ao baixar o bot (HTTP $CODE)." ;;
            esac
            exit 1
          fi
          unzip -tq bot.zip >/dev/null || { echo "::error::O arquivo baixado não é um ZIP válido."; exit 1; }
          echo "Bot baixado: $(du -h bot.zip | cut -f1)"

      - name: Extrair o bot
        run: |
          set -euo pipefail
          rm -rf extracted && mkdir extracted
          unzip -q bot.zip -d extracted
          rm -f bot.zip
          INDEX=$(find extracted -name index.js -not -path "*/node_modules/*" -not -path "*/tools/*" -not -path "*/.git/*" | head -n 1)
          [ -n "$INDEX" ] || { echo "::error::index.js não encontrado dentro do zip."; exit 1; }
          echo "APP_DIR=$GITHUB_WORKSPACE/$(dirname "$INDEX")" >> "$GITHUB_ENV"

      - name: Instalar dependências do bot
        working-directory: ${{ env.APP_DIR }}
        run: npm install --omit=dev --no-audit --no-fund >/dev/null 2>&1

      - name: Cache dos binários do Luau
        id: luau-cache
        uses: actions/cache@v4
        with:
          path: luau-bin
          # v2: o conteúdo do patch do Luau mudou (getrawmetatable/setrawmetatable, pro v15.2) sem
          # mudar o LUAU_TAG - sem trocar a chave, o cache antigo (sem essa correção) seria reusado
          # pra sempre em vez de recompilar. Se mexer no patch de novo, suba o número de novo.
          key: luau-${{ env.LUAU_TAG }}-v2

      - name: Compilar luau e luau-ast
        if: steps.luau-cache.outputs.cache-hit != 'true'
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake ninja-build g++
          git clone -q --depth 1 --branch "$LUAU_TAG" https://github.com/luau-lang/luau.git "$RUNNER_TEMP/luau"
          BUILD_PY=$(find "$APP_DIR/tools" -name build_luau.py | head -n 1)
          python3 "$BUILD_PY" --src "$RUNNER_TEMP/luau" --portable >/dev/null 2>&1
          cmake --build "$RUNNER_TEMP/luau/build-deobf" --target Luau.Ast.CLI --parallel >/dev/null 2>&1
          mkdir -p luau-bin
          cp "$(dirname "$BUILD_PY")/bin/luau" luau-bin/luau
          cp "$RUNNER_TEMP/luau/build-deobf/luau-ast" luau-bin/luau-ast

      - name: Instalar .NET 8 e 9 (MoonSec, 77fuscator, IronBrew 2)
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            9.0.x

      - name: Instalar Lune (Goofyscator)
        run: |
          set -uo pipefail
          curl -fsSL -o "$RUNNER_TEMP/lune.zip" "https://github.com/lune-org/lune/releases/download/v0.10.5/lune-0.10.5-linux-x86_64.zip" \
            && sudo unzip -q -o "$RUNNER_TEMP/lune.zip" -d /usr/local/bin \
            && sudo chmod +x /usr/local/bin/lune && lune --version \
            || echo "::warning::Lune nao instalou (Goofyscator ficara indisponivel)."

      # O teste do Lumora contra o mm2_obf (Luraph v14.9) travado foi removido: o rastreamento
      # mostrou que o script fica só chamando getfenv() pra sempre, sem nenhuma outra operação -
      # não é 1-2 nomes de variável vazando, parece checar a "assinatura" inteira do ambiente
      # contra um executor real, o que nenhum runtime próprio (Lumora incluso) vai bater. Sem
      # motivo pra gastar tempo de CI compilando e testando isso de novo.

      - name: Preparar ferramentas externas
        run: |
          set -uo pipefail
          chmod +x "$APP_DIR/tools/external/moonsec/bin/lua5.1" || true
          for f in tools/external/moonsec/dotnet/MoonsecDeobfuscator.dll \
                   tools/external/omni/77fuscatorDeobf/deobfuscator.dll \
                   tools/external/omni/IronBrew2Deobf/ib2bot-main/ib2deobf/LuaAnalysis.Ironbrew2.dll; do
            [ -f "$APP_DIR/$f" ] && echo "ok $f" || echo "::error::faltando $f no zip"
          done
          dotnet --list-runtimes

      - name: Instalar binários nas pastas das ferramentas
        run: |
          set -euo pipefail
          for d in $(find "$APP_DIR/tools" -type d -name bin); do
            cp luau-bin/luau luau-bin/luau-ast "$d/"
            chmod +x "$d/luau" "$d/luau-ast"
          done

      # Logs de repositório público são visíveis a todos: o bot escreve num arquivo
      # e só as últimas linhas (sem IDs/links) aparecem se ele cair.
      - name: Ligar o bot
        working-directory: ${{ env.APP_DIR }}
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          PASTEFY_TOKEN: ${{ secrets.PASTEFY_TOKEN }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MONGO_URI: ${{ secrets.MONGO_URI }}
          MONGO_DB: ${{ vars.MONGO_DB }}
          GITHUB_TOKEN: ""
        run: |
          echo "Bot iniciado em $(date -u +%H:%M) UTC"
          if ! node index.js > "$RUNNER_TEMP/bot.log" 2>&1; then
            echo "::warning::O bot encerrou. Últimas linhas (sem detalhes de usuários):"
            tail -n 12 "$RUNNER_TEMP/bot.log" | sed -E 's/[0-9]{15,}/<id>/g; s/https?:\/\/[^ ]+/<url>/g' | cut -c1-200
            exit 1
          fi
          
